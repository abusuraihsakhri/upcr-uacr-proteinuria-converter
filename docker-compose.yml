version: '3.8'

services:
  upcr-uacr-proteinuria-converter:
    build: .
    container_name: upcr-uacr-proteinuria-converter
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=upcr-uacr-proteinuria-converter-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
